# Configuração mínima para `supabase functions deploy`.
# O chat público é aberto a visitantes sem login: a própria função
# valida o token do link e, quando há, o login do dono (modo teste).
[functions.public-chat]
verify_jwt = false

[functions.assistant-builder-chat]
verify_jwt = true

[functions.dados-e-relatorios]
verify_jwt = true

[functions.conta]
verify_jwt = true

[functions.sql-server]
verify_jwt = true

# Canais: o painel conecta com login. Os avisos da Meta e do Discord
# chegam pelo public-chat (?canal=meta, ?discord=<id>), que confere a
# assinatura de cada um.
[functions.canais]
verify_jwt = true

[functions.pagamentos]
# avisos do Asaas chegam sem login (conferidos pelo token)
verify_jwt = false

# E-mails do login com a cara do Helpy (gerados por supabase/templates/gerar.mjs).
# No painel: Authentication → Emails → Templates, um por um.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Helpy"
content_path = "./supabase/templates/confirmacao.html"

[auth.email.template.invite]
subject = "Você foi convidado para o Helpy"
content_path = "./supabase/templates/convite.html"

[auth.email.template.magic_link]
subject = "Seu link para entrar no Helpy"
content_path = "./supabase/templates/link_magico.html"

[auth.email.template.email_change]
subject = "Confirme o novo e-mail da sua conta"
content_path = "./supabase/templates/troca_email.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do Helpy"
content_path = "./supabase/templates/nova_senha.html"

[auth.email.template.reauthentication]
subject = "Seu código de confirmação do Helpy"
content_path = "./supabase/templates/codigo.html"
